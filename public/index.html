<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fb">
  <title>OTP Verification</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <header class="site-header">
        <div class="logo" aria-hidden="true">✓</div>
        <span>Simple Verify</span>
      </header>

      <div class="intro">
        <p class="eyebrow">ONE-TIME PASSWORD</p>
        <h1 id="page-title">Verify your contact</h1>
        <p class="description">Choose email or text message. We’ll send you a short code to confirm it’s yours.</p>
      </div>

      <div class="tabs" role="group" aria-label="Choose how to receive your code">
        <button class="tab active" type="button" data-channel="email" aria-pressed="true">Email</button>
        <button class="tab" type="button" data-channel="sms" aria-pressed="false">Text message</button>
      </div>

      <form id="send-form">
        <label id="destination-label" for="destination">Email address</label>
        <input id="destination" name="destination" type="email" placeholder="you@example.com" autocomplete="email" required>
        <p class="help" id="destination-help">We’ll send a six-digit code to this address.</p>
        <button class="primary" type="submit">Send code</button>
      </form>

      <form id="verify-form" class="hidden">
        <label for="code">Verification code</label>
        <input id="code" name="code" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required>
        <p class="help" id="sent-message"></p>
        <button class="primary" type="submit">Verify code</button>
        <button id="change-contact" class="secondary" type="button">Use a different email or number</button>
      </form>

      <p id="status" class="status hidden" role="status" aria-live="polite"></p>
      <footer>Codes expire after five minutes and can only be used once.</footer>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
