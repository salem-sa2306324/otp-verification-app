<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify — Secure access</title><link rel="stylesheet" href="/style.css"></head><body><main><section><b class="brand">v. verify<span>.</span></b><article><small>SECURE ACCESS</small><h1>Confirm it’s<br>really <em>you.</em></h1><p>Choose where we should send your one-time verification code.</p><nav><button class="active" data-c="email">✉ Email</button><button data-c="sms">▣ Text message</button></nav><form id="send"><label id="label">Email address</label><input id="dest" type="email" placeholder="you@example.com" required><p id="hint">We’ll send a six-digit code to this address.</p><button class="submit">Send verification code <b>→</b></button></form><form id="verify" hidden><label for="code">Your 6-digit code</label><input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required><p id="sent"></p><button class="submit">Verify and continue <b>→</b></button><button id="change" type="button">← Change contact</button></form><div id="notice" role="status"></div></article><footer>Encrypted and used only for verification.</footer></section><aside><div class="shield">✦<strong>✓</strong></div><h2>Peace of mind,<br><em>in every sign-in.</em></h2><p>Extra protection for what matters most.</p></aside></main><script src="/app.js"></script></body></html>
